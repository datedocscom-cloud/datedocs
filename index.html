<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DateDocs - Customized Matchmaking</title>
<meta name="description" content="Qualify. Make Plans. Meet. Curated matchmaking for doctors." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --card-soft: #fbf9f6;
    --border: #e9e4dc;
    --fg: #1a1612;
    --muted: #6b6258;
    --accent: #a8332a;
    --accent-soft: #f3e4e2;
    --shadow-sm: 0 1px 2px rgba(26,22,18,0.04), 0 1px 3px rgba(26,22,18,0.06);
    --shadow-md: 0 4px 12px rgba(26,22,18,0.06), 0 2px 4px rgba(26,22,18,0.04);
    --shadow-lg: 0 12px 32px rgba(26,22,18,0.08), 0 4px 12px rgba(26,22,18,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }

  /* NAV */
  nav.topnav {
    border-bottom: 1px solid var(--border);
    background: rgba(250,248,245,0.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-inner {
    max-width: 1280px; margin: 0 auto; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-left { display: flex; gap: 18px; align-items: center; }
  .nav-pill { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); }
  .nav-link { font-size: 14px; color: var(--fg); text-decoration: none; padding: 6px 4px; cursor: pointer; }
  .nav-link:hover { color: var(--accent); }
  .nav-right { display: flex; gap: 10px; }
  .btn { font-family: inherit; font-size: 14px; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all .15s ease; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #8a261f; color: white; }
  .logo-row { display: flex; flex-direction: column; align-items: center; padding: 18px 0 8px; }
  .logo { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; color: var(--fg); }
  .logo .accent { color: var(--accent); font-style: normal; }
  .tagline { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }

  /* HEADLINE */
  main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }
  .headline { text-align: center; padding: 16px 16px 28px; max-width: 720px; margin: 0 auto; }
  .headline h1 {
    font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 400;
    line-height: 1.4; letter-spacing: 0; color: var(--muted);
  }
  .headline h1 em { color: var(--accent); font-style: italic; }
  @media (max-width: 760px) { .headline h1 { font-size: 16px; } }

  /* CITY SECTION */
  .city-section { margin-bottom: 48px; }
  .city-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .city-header h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .city-header .count { font-size: 13px; color: var(--muted); }
  .tab-row { display: flex; gap: 4px; margin: 14px 0 20px; }
  .tab { font-size: 13px; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all .15s; }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: var(--fg); color: white; border-color: var(--fg); }
  .subhead { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; margin: 28px 0 14px; color: var(--muted); }

  /* SPLIT GRID — men left, women right */
  .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 760px) { .split-grid { grid-template-columns: 1fr; } .split-col .profile-grid { grid-template-columns: 1fr; } }
  .split-col h3 {
    font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500;
    color: var(--muted); margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); letter-spacing: 0.04em;
    text-transform: uppercase; font-size: 12px;
  }
  .split-col .profile-grid { grid-template-columns: repeat(2, 1fr); }

  /* PROFILE GRID */
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
  .profile-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .profile-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .photo-wrap { position: relative; aspect-ratio: 1 / 1; background: #ecebe7; overflow: hidden; }
  .photo-wrap img, .photo-wrap svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-wrap img[src^="data:image/svg"] { object-fit: cover; background: #ecebe7; }
  .photo-wrap .badge {
    position: absolute; top: 10px; left: 10px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    background: rgba(26,22,18,0.78); color: white; padding: 4px 9px; border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .photo-wrap .play-icon {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); opacity: 0; transition: opacity .15s;
  }
  .photo-wrap.has-video:hover .play-icon { opacity: 1; }
  .photo-wrap .play-icon::before {
    content: ''; width: 0; height: 0; margin-left: 4px;
    border-left: 14px solid var(--accent); border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  }
  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name-row { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 600; letter-spacing: -0.005em; }
  .meta-line { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .meta-line strong { color: var(--fg); font-weight: 500; }
  .request-btn {
    margin-top: 10px; padding: 9px 14px; font-size: 13px; font-weight: 500;
    background: var(--card-soft); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: all .15s; letter-spacing: 0.02em;
  }
  .request-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  /* Card preview text: clamp to 3 lines, fade/ellipsis handled by line-clamp */
  .preview-text {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; white-space: pre-line;
  }
  .details-btn {
    margin-top: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
    cursor: pointer; transition: all .15s; letter-spacing: 0.02em;
  }
  .details-btn:hover { background: var(--accent); color: #fff; }

  /* Full-profile popup */
  .profile-modal { max-width: 540px; max-height: 88vh; overflow-y: auto; position: relative; }
  .modal-close {
    position: absolute; top: 14px; right: 16px; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .modal-close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pf-header { display: flex; gap: 16px; align-items: center; margin: 4px 36px 18px 0; }
  .pf-photo { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: #ecebe7; flex: none; }
  .pf-name { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .pf-sub { font-size: 14px; color: var(--accent); margin-top: 2px; }
  .pf-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-bottom: 18px; }
  .pf-stat { display: flex; flex-direction: column; gap: 2px; }
  .pf-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .pf-stat-val { font-size: 14px; color: var(--fg); }
  .pf-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .pf-section h4 { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .pf-section p { font-size: 14px; color: var(--muted); line-height: 1.65; white-space: pre-line; }
  @media (max-width: 480px) { .pf-stats { grid-template-columns: 1fr; } }
  .voice-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--accent); cursor: pointer; padding: 4px 0; background: none; border: none; font-family: inherit;
  }
  .voice-btn::before {
    content: '♪'; font-size: 14px;
  }

  /* HOW IT WORKS */
  .how-section { margin-bottom: 48px; scroll-margin-top: 140px; }
  .how-section .intro { font-size: 15px; color: var(--muted); line-height: 1.7; max-width: 720px; margin: 0 auto 28px; text-align: center; }
  .how-section .intro strong { color: var(--fg); font-weight: 500; }
  .two-track { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  @media (max-width: 760px) { .two-track { grid-template-columns: 1fr; } }
  .track {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; box-shadow: var(--shadow-sm);
  }
  .track-tag {
    display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px;
    margin-bottom: 12px;
  }
  .track h3 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
  .track p { font-size: 14px; color: var(--muted); line-height: 1.65; }
  .steps {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 8px;
  }
  @media (max-width: 760px) { .steps { grid-template-columns: 1fr 1fr; } }
  .step { text-align: center; padding: 0 8px; }
  .step-num {
    font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700;
    color: var(--accent); line-height: 1; margin-bottom: 6px; font-style: italic;
  }
  .step h4 { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .step p { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border); margin-top: 60px; padding: 28px 24px;
    text-align: center; color: var(--muted); font-size: 13px;
  }
  footer .logo { font-size: 24px; margin-bottom: 4px; }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,22,18,0.55); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; max-width: 480px; width: 100%;
    padding: 28px; box-shadow: var(--shadow-lg);
  }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 6px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .modal label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 0 6px; }
  .modal input, .modal textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 14px; background: white; outline: none;
  }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
</style>
</head>

<nav class="topnav">
  <div class="nav-inner">
    <div class="nav-left">

      <a class="nav-link" href="how-it-works.html">How It Works</a>
    </div>

      <button class="btn">Sign In</button>
      <button class="btn btn-primary">Sign Up</button>
    </div>
  </div>
  <div class="logo-row">

    <div class="tagline">Qualify · Make Plans · Meet</div>
  </div>
</nav>

<main>

  <!-- HEADLINE -->
  <section class="headline">

      </div>
    </div>
  </section>

</main>

<footer>
  <div class="logo">Date<span class="accent">Docs</span></div>
  <div>© 2026 · Curated introductions for medical professionals</div>
</footer>

<!-- REQUEST MEET MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 class="serif">Request a Meet</h3>
    <p id="modal-target" style="font-style: italic;">with Dr. Profile</p>
    <label>Your name</label>
    <input type="text" placeholder="Dr. Jane Smith" />
    <label>Your specialty</label>
    <input type="text" placeholder="Cardiology" />
    <label>A short note</label>
    <textarea placeholder="Coffee between shifts? I noticed we both did residency at..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="sentRequest()">Send Request</button>
    </div>
  </div>
</div>

<!-- FULL PROFILE MODAL -->
<div class="modal-backdrop" id="profile-modal">
  <div class="modal profile-modal">
    <button class="modal-close" onclick="closeProfile()" aria-label="Close">&times;</button>
    <div id="profile-body"></div>
  </div>
</div>

function silhouetteSVG(g) {
  const color = g === 'f' ? '#c9b8a8' : '#a89c8e';
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#ecebe7"/>
    <circle cx="100" cy="75" r="32" fill="${color}"/>
    <path d="M40 200 Q40 130 100 130 Q160 130 160 200 Z" fill="${color}"/>
  </svg>`;
}

function renderCard(p) {
  const sampleBadge = p.sample ? '<span class="badge" style="background:rgba(168,51,42,0.85);">Sample</span>' : '';
  const photo = p.anon
    ? `<div class="photo-wrap">${silhouetteSVG(p.g)}<span class="badge">Anonymous</span></div>`
    : `<div class="photo-wrap ${p.hasVideo ? 'has-video':''}">
         <img src="${p.photo || avatarFor(p.seed, p.g)}" alt="${p.name}" loading="lazy" />
         ${p.hasVideo ? '<span class="badge">Video</span><div class="play-icon"></div>' : sampleBadge}
       </div>`;

  // Upfront fields shown on every card (before clicking in):
  //   name + age, city, specialty, height · kids, age range
  const summary = p.anon
    ? `<div class="name-row">${p.name}, ${p.age}</div>
       <div class="meta-line">${p.city}</div>
       <div class="meta-line"><strong>${p.specialty}</strong></div>`
    : `<div class="name-row">${p.name}, ${p.age}</div>
       <div class="meta-line">${p.city}</div>
       <div class="meta-line"><strong>${p.specialty}</strong></div>
       ${p.height || p.kids ? `<div class="meta-line">${[p.height, p.kids].filter(Boolean).join(' · ')}</div>` : ''}
       ${p.looking ? `<div class="meta-line">${p.looking}</div>` : ''}`;

  // Card shows a short, clamped preview of the About text ending in "…"
  const hasDetails = !p.anon && (p.bio || p.wants || p.hasVoice);
  const preview = (p.bio || p.wants) ? `
    <div class="meta-line" style="margin-top:6px;padding-top:8px;border-top:1px solid var(--border);">
      <span class="preview-text">${p.bio || p.wants}</span>
    </div>` : '';

  const detailsBtn = hasDetails
    ? `<button class="details-btn" onclick="openProfile('${p.id}')">View Full Details</button>`
    : '';

  return `<div class="profile-card" data-gender="${p.g}">
    ${photo}
    <div class="card-body">
      ${summary}
      ${preview}
      ${detailsBtn}
      <button class="request-btn" onclick="openModal('${p.name}')">Request to Meet</button>
    </div>
  </div>`;
}

/* Registry of all profiles by id, so the popup can look them up */
const PROFILE_BY_ID = {};

/* Open the full-profile popup */
function openProfile(id) {
  const p = PROFILE_BY_ID[id];
  if (!p) return;
  const photoSrc = p.photo || avatarFor(p.seed, p.g);
  const rows = [
    ['Location', p.city],
    ['Specialty', p.specialty],
    ['Height', p.height],
    ['Children', p.kids],
    ['Seeking', p.looking],
  ].filter(r => r[1]);

  const statsHTML = rows.map(r =>
    `<div class="pf-stat"><span class="pf-stat-label">${r[0]}</span><span class="pf-stat-val">${r[1]}</span></div>`
  ).join('');

  const aboutHTML = p.bio ? `<div class="pf-section"><h4>About ${p.name}</h4><p>${p.bio}</p></div>` : '';
  const wantsHTML = p.wants ? `<div class="pf-section"><h4>Looking for</h4><p>${p.wants}</p></div>` : '';

  document.getElementById('profile-body').innerHTML = `
    <div class="pf-header">
      <img class="pf-photo" src="${photoSrc}" alt="${p.name}" />
      <div>
        <div class="pf-name serif">${p.name}, ${p.age}</div>
        <div class="pf-sub">${p.specialty || ''}</div>
      </div>
    </div>
    <div class="pf-stats">${statsHTML}</div>
    ${aboutHTML}
    ${wantsHTML}
    <button class="btn btn-primary" style="margin-top:18px;width:100%;" onclick="closeProfile(); openModal('${p.name}');">Request to Meet</button>
  `;
  document.getElementById('profile-modal').classList.add('open');
}
function closeProfile() {
  document.getElementById('profile-modal').classList.remove('open');
}

function renderAll() {
  // Split non-anonymous profiles by gender — men on the left, women on the right
  // Within each column: Amar (stp) and Leah (sf) lead, then samples
  const order = ['stp', 'sf', 'nyc', 'chi'];
  const allProfiles = [];
  for (const key of order) {
    if (DATA[key]) allProfiles.push(...DATA[key]);
  }
  const men = allProfiles.filter(p => p.g === 'm');
  const women = allProfiles.filter(p => p.g === 'f');
  // Build a lookup so the full-profile popup can find any person by id
  allProfiles.forEach(p => { PROFILE_BY_ID[p.id] = p; });
  document.getElementById('grid-men').innerHTML = men.map(renderCard).join('');
  document.getElementById('grid-women').innerHTML = women.map(renderCard).join('');
  document.getElementById('total-count').textContent = `${allProfiles.length} people · ${men.length} men · ${women.length} women`;
}

function filterGender(btn, city, gender) {
  // tab styling
  btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  // card display
  const cards = document.querySelectorAll(`#grid-${city} .profile-card`);
  cards.forEach(c => {
    c.style.display = (gender === 'all' || c.dataset.gender === gender) ? '' : 'none';
  });
}

/* Modal */
function openModal(name) {
  document.getElementById('modal-target').textContent = 'with ' + name;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function sentRequest() {
  closeModal();
  alert('Request sent! (Demo only — wire this to your backend.)');
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('profile-modal').addEventListener('click', e => {
  if (e.target.id === 'profile-modal') closeProfile();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeProfile(); }
});

renderAll();
</script>
